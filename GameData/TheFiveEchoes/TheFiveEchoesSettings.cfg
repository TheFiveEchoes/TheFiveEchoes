TheFiveEchoesSettings
{
    SystemScale = 3
    //Determines the scale of the planetary bodies
    //Options are 3, 2 and 1; Default is 3
    //3 equals to Real Scale
    //2 equals to 2.5/Quarter Scale
    //1 equals to Kerbal Scale
    //This setting will also rescale all planet mods compatible with The Five Echoes

    UseWormholes = True
    //Determines if Wormholes are enabled or not
    //Options are True and False; Default is True
    //True enables the Wormhole network around Lisphana
    //False disables all Wormholes

    EnableAxialTilt = False
    //Determines if Axial Tilt is enabled or not
    //Options are True and False; Default is False
    //True gives celestial bodies an Axial Tilt and also changes lunar orbits to be around their planet's euqator in most cases
    //False disables Axial Tilt completely

    EnableSystemPlanes = True
    //Determines if each Star System has its own main Orbital Plane.
    //Options are True and False; Default is True
    //True enables unique Orbital Planes for each Star System
    //False disables Orbital Planes

    WhiteStarLight = False
    //Determines if the light emitted by all stars is white or their approximate true color
    //Options are True and False; Default is False
    //True will make it so that all stars' light is white
    //False will give star an approximate real emitted light color

    AutoDeleteCache = False
    //Determines if the Cache files in TheFiveEchoes/Cache are automatically deleted or not
    //Options are True and False; Default is False
    //True will make the Cache files be deleted automatically during the SpaceCenter scene
    //False will disable the automatic deletion

    TimeOffset = True
    //Determines if the time is offset to the equivalent of the March Equinox at Verlod
    //Options are True and False; Default is True
    //True will offset the time to the March Equinox equivalent
    //False will not offset the time
}