@Kopernicus:HAS[@TheFiveEchoesSettings:HAS[#WhiteStarLight[True]]]:FOR[xxx_TFE_WhiteStarLight]
{
    @Body:HAS[#TFEClassification[TFE_Star]]
    {
        @ScaledVersion
        {
            @Light
            {
                %sunlightColor = #FFFFFF
                %scaledSunlightColor = #FFFFFF
                %IVASunColor = #FFFFFF
                %ambientLightColor = #FFFFFF
                %sunLensFlareColor = #FFFFFF
            }
        }
    }
}

@Scatterer_planetsList:HAS[@TheFiveEchoesSettings:HAS[WhiteStarLight[True]]]:FOR[xxx_TFE_WhiteStarLight]
{
    @scattererCelestialBodies
    {
        @Item[*]:HAS[#TFE_Star[1]]
        {
            %sunColor = 1,1,1,1
            @secondarySuns
            {
                @Item[*]
                {
                    %sunColor = 1,1,1,1
                }
            }
        }
        
    }
}