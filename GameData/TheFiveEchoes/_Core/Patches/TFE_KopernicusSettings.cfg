@Kopernicus_config:BEFORE[TheFiveEchoes]
{
    @HomeWorldName = Verlod
    @DisableFarAwayColliders = True
    @UseOnDemandLoader = True
}
@Kopernicus:FOR[001_TFEOnDemand]
{
    %useOnDemand = True
    %onDemandLoadOnMissing = true
    %onDemandLogOnMissing = false
    %onDemandForceCollect = false
    %force3DOrbits = true
}