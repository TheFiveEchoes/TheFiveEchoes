@PART[RelayAntenna5]:FINAL
{
    @MODULE[ModuleDataTransmitter]
    {
        showUpgradesInModuleInfo = true
        UPGRADES
        {
            UPGRADE
            {
                name__ = Relay5-CommsUpgrade
                techRequired__ = advancedRelayUpgrades
                antennaPower = 12000000000000
